<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Learning Interactive MCQ Quiz | Day 4 Afternoon: Pretrained Foundation Models (BERT & GPT)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg-base: #f8fafc;
  --bg-card: #ffffff;
  --border-color: #e2e8f0;
  --border-hover: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --primary: #4f46e5;
  --primary-light: #eef2ff;
  --primary-dark: #3730a3;

  --success-bg: #f0fdf4;
  --success-border: #86efac;
  --success-text: #166534;

  --error-bg: #fef2f2;
  --error-border: #fca5a5;
  --error-text: #991b1b;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.06);
  --radius-lg: 1rem;
  --radius-md: 0.75rem;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-base);
  color: var(--text-main);
  line-height: 1.6;
  padding: 2rem 1.5rem;
}

.container {
  max-width: 860px;
  margin: 0 auto;
}

.header-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.5rem 2rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.logo-img { height: 48px; object-fit: contain; }

.quiz-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 2rem;
  box-shadow: var(--shadow-md);
  margin-bottom: 1.5rem;
}

.progress-bar-container {
  background: #e2e8f0;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.progress-fill {
  background: linear-gradient(90deg, #6366f1, #4f46e5);
  height: 100%;
  width: 5%;
  transition: width 0.3s ease;
}

.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.q-badge {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  padding: 0.2rem 0.6rem;
  border-radius: 9999px;
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid #c7d2fe;
}

.q-title {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--text-main);
  margin-bottom: 0.5rem;
}

.q-text {
  font-size: 0.96rem;
  color: #334155;
  margin-bottom: 1.25rem;
  line-height: 1.55;
}

.diagram-box {
  background: #f8fafc;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-bottom: 1.5rem;
  display: flex;
  justify-content: center;
  align-items: center;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.option-btn {
  background: #ffffff;
  border: 1.5px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 1rem 1.25rem;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--text-main);
  text-align: left;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--primary);
  background: #f8fafc;
  transform: translateY(-1px);
}

.opt-prefix {
  font-weight: 700;
  color: var(--primary);
  min-width: 24px;
}

.option-btn.correct {
  background: var(--success-bg) !important;
  border-color: var(--success-border) !important;
  color: var(--success-text) !important;
}

.option-btn.incorrect {
  background: var(--error-bg) !important;
  border-color: var(--error-border) !important;
  color: var(--error-text) !important;
}

.feedback-box {
  display: none;
  border-radius: var(--radius-md);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  font-size: 0.88rem;
  line-height: 1.5;
}

.feedback-box.show {
  display: block;
}

.feedback-correct {
  background: var(--success-bg);
  border: 1px solid var(--success-border);
  color: var(--success-text);
}

.feedback-incorrect {
  background: var(--error-bg);
  border: 1px solid var(--error-border);
  color: var(--error-text);
}

.nav-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-md);
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: all 0.2s ease;
}

.btn-primary {
  background: var(--primary);
  color: white;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-dark);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.results-screen {
  display: none;
  text-align: center;
  padding: 2.5rem 1rem;
}

.score-big {
  font-size: 3.5rem;
  font-weight: 800;
  color: var(--primary);
  margin: 1rem 0 0.5rem 0;
}
</style>
</head>

let currentIdx = 0;
let userAnswers = new Array(quizData.length).fill(null);
let score = 0;

const qCounter = document.getElementById('q-counter');
const scoreCounter = document.getElementById('score-counter');
const progressFill = document.getElementById('progress-fill');
const qBadge = document.getElementById('q-badge');
const qTitle = document.getElementById('q-title');
const qText = document.getElementById('q-text');
const qDiagram = document.getElementById('q-diagram');
const optionsContainer = document.getElementById('options-container');
const feedbackBox = document.getElementById('feedback-box');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const quizFrame = document.getElementById('quiz-frame');
const resultsFrame = document.getElementById('results-frame');
const finalScore = document.getElementById('final-score');
const scoreMessage = document.getElementById('score-message');
const restartBtn = document.getElementById('restart-btn');

function renderQuestion(idx) {
  const item = quizData[idx];
  qCounter.innerText = `Question ${idx + 1} of ${quizData.length}`;
  progressFill.style.width = `${((idx + 1) / quizData.length) * 100}%`;
  scoreCounter.innerText = `Score: ${score} / ${quizData.length}`;
  qTitle.innerText = item.title;
  qText.innerText = item.question;
  qDiagram.innerHTML = item.svg;

  optionsContainer.innerHTML = '';
  feedbackBox.className = 'feedback-box';
  feedbackBox.style.display = 'none';

  const letters = ['A', 'B', 'C', 'D'];
  const hasAnswered = userAnswers[idx] !== null;

  item.options.forEach((optText, optIdx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-prefix">${letters[optIdx]}.</span> <span>${optText}</span>`;

    if (hasAnswered) {
      btn.disabled = true;
      if (optIdx === item.answer) {
        btn.classList.add('correct');
      } else if (optIdx === userAnswers[idx]) {
        btn.classList.add('incorrect');
      }
    } else {
      btn.addEventListener('click', () => handleAnswer(optIdx));
    }
    optionsContainer.appendChild(btn);
  });

  if (hasAnswered) {
    showFeedback(userAnswers[idx] === item.answer, item.explanation);
    nextBtn.disabled = false;
  } else {
    nextBtn.disabled = true;
  }

  prevBtn.disabled = idx === 0;
  nextBtn.innerText = idx === quizData.length - 1 ? 'Finish Quiz 🏁' : 'Next Question ▶';
}

function handleAnswer(selectedIdx) {
  const item = quizData[currentIdx];
  userAnswers[currentIdx] = selectedIdx;
  const isCorrect = selectedIdx === item.answer;

  if (isCorrect) {
    score++;
    scoreCounter.innerText = `Score: ${score} / ${quizData.length}`;
  }

  const optionBtns = optionsContainer.querySelectorAll('.option-btn');
  optionBtns.forEach((btn, idx) => {
    btn.disabled = true;
    if (idx === item.answer) {
      btn.classList.add('correct');
    } else if (idx === selectedIdx) {
      btn.classList.add('incorrect');
    }
  });

  showFeedback(isCorrect, item.explanation);
  nextBtn.disabled = false;
}

function showFeedback(isCorrect, explanation) {
  feedbackBox.style.display = 'block';
  if (isCorrect) {
    feedbackBox.className = 'feedback-box feedback-correct show';
    feedbackBox.innerHTML = `<strong>✅ Correct!</strong> ${explanation}`;
  } else {
    feedbackBox.className = 'feedback-box feedback-incorrect show';
    feedbackBox.innerHTML = `<strong>❌ Incorrect.</strong> ${explanation}`;
  }
}

prevBtn.addEventListener('click', () => {
  if (currentIdx > 0) {
    currentIdx--;
    renderQuestion(currentIdx);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentIdx < quizData.length - 1) {
    currentIdx++;
    renderQuestion(currentIdx);
  } else {
    showResults();
  }
});

function showResults() {
  quizFrame.style.display = 'none';
  resultsFrame.style.display = 'block';
  finalScore.innerText = `${score} / ${quizData.length}`;

  const pct = (score / quizData.length) * 100;
  if (pct >= 85) {
    scoreMessage.innerText = '🌟 Outstanding! You possess a deep, production-grade architectural mastery of Transformers, BERT, GPT, and LoRA!';
  } else if (pct >= 65) {
    scoreMessage.innerText = '👍 Great job! You have solid foundational knowledge. Review the interactive visualizer to master the subtle mathematical nuances.';
  } else {
    scoreMessage.innerText = '📚 Good attempt! Re-read the lecture speaker notes and test the interactive tokenizers to strengthen your understanding.';
  }
}

restartBtn.addEventListener('click', () => {
  currentIdx = 0;
  userAnswers.fill(null);
  score = 0;
  resultsFrame.style.display = 'none';
  quizFrame.style.display = 'block';
  renderQuestion(0);
});

renderQuestion(0);
</script>
