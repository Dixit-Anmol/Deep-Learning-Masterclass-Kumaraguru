<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applied Deep Learning Masterclass | Day 2 Afternoon Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    :root {
      --bg-base: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-subtle: #f1f5f9;
      --border-color: #e2e8f0;
      --border-hover: #cbd5e1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --primary: #4f46e5;
      --primary-light: #eef2ff;
      --primary-dark: #3730a3;
      --primary-glow: rgba(79, 70, 229, 0.18);
      
      --accent-emerald: #10b981;
      --accent-emerald-light: #ecfdf5;
      --accent-rose: #f43f5e;
      --accent-rose-light: #fff1f2;
      --accent-amber: #f59e0b;
      --accent-amber-light: #fffbeb;
      --accent-sky: #0284c7;
      --accent-sky-light: #f0f9ff;
      
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.06), 0 4px 6px -4px rgba(0,0,0,0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.07), 0 8px 10px -6px rgba(0,0,0,0.04);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Header */
    header.quiz-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 12px 28px;
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: 1020px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon-box {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .score-badge {
      background: var(--primary-light);
      border: 1px solid rgba(79, 70, 229, 0.2);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .edulateral-logo-box {
      display: flex;
      align-items: center;
      background: #ffffff;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .edulateral-logo-img {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    /* Main Container */
    main.quiz-main {
      flex: 1;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Question Navigation Pills Bar */
    .pills-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      box-shadow: var(--shadow-sm);
    }

    .pills-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-right: 8px;
      flex-shrink: 0;
    }

    .pill-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .pill-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(79, 70, 229, 0.35);
    }

    .pill-btn.correct {
      background: var(--accent-emerald) !important;
      border-color: var(--accent-emerald) !important;
      color: #ffffff !important;
    }

    .pill-btn.wrong {
      background: var(--accent-rose) !important;
      border-color: var(--accent-rose) !important;
      color: #ffffff !important;
    }

    /* Single Question Card View */
    .question-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .q-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .q-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-category {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-diff {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: var(--radius-full);
    }

    .badge-diff.easy {
      background: var(--accent-emerald-light);
      color: #065f46;
    }

    .badge-diff.moderate {
      background: var(--accent-amber-light);
      color: #92400e;
    }

    .q-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-light);
    }

    .q-stem {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Options List */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #fafbff;
      transform: translateY(-1px);
    }

    .opt-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--bg-card-subtle);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .opt-btn:hover:not(:disabled) .opt-badge {
      background: var(--primary-light);
      color: var(--primary);
    }

    .opt-text {
      flex: 1;
      line-height: 1.4;
    }

    /* Evaluated States */
    .opt-btn.correct {
      border-color: var(--accent-emerald) !important;
      background: var(--accent-emerald-light) !important;
      color: #065f46 !important;
      font-weight: 700;
    }
    .opt-btn.correct .opt-badge {
      background: var(--accent-emerald) !important;
      color: #ffffff !important;
    }

    .opt-btn.wrong {
      border-color: var(--accent-rose) !important;
      background: var(--accent-rose-light) !important;
      color: #991b1b !important;
    }
    .opt-btn.wrong .opt-badge {
      background: var(--accent-rose) !important;
      color: #ffffff !important;
    }

    /* Teaser / Lock Box (Visible before answering) */
    .teaser-lock-card {
      background: #fafaf9;
      border: 1.5px dashed var(--border-hover);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .teaser-icon {
      font-size: 22px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    /* Revealed Visual & Explanation Section */
    .visual-explanation-card {
      display: none;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      flex-direction: column;
      gap: 16px;
      animation: fadeIn 0.3s ease forwards;
    }

    .visual-explanation-card.revealed {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .verdict-header {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .verdict-header.correct {
      color: #065f46;
    }

    .verdict-header.wrong {
      color: #991b1b;
    }

    .diagram-display-box {
      background: #fafaf9;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: auto;
    }

    .explanation-text {
      font-size: 0.92rem;
      color: var(--text-main);
      line-height: 1.6;
      background: var(--bg-card-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      border-left: 4px solid var(--primary);
    }

    /* Navigation Footer Controls */
    .card-footer-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .nav-btn-action {
      padding: 10px 20px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn-action:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-1px);
    }

    .nav-btn-action.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .nav-btn-action.primary:hover:not(:disabled) {
      background: var(--primary-dark);
      color: #ffffff;
    }

    .nav-btn-action:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

  <script>
    const questionsData = [{"id": 1, "category": "NLP Foundations", "difficulty": "EASY", "question": "Why can neural networks NOT directly compute floating-point activations from raw text strings like 'happy' or 'machine'?", "options": ["Raw words lack ASCII character encoding in modern GPU memory", "Words are discrete symbolic tokens that lack natural geometric continuity and cannot be multiplied by floating-point weight matrices", "GPU tensor cores are hardwired to only accept image pixel formats (RGB)", "Text strings inherently violate backpropagation derivatives because letters cannot be capitalized"], "correct": 1, "explanation": "Computers and deep neural networks perform numerical linear algebra (matrix multiplications and gradient descents). Words in human language are discrete symbolic tokens without inherent scalar magnitudes. Before any neural layer can process language, discrete words must be mapped to continuous dense vector spaces (embeddings).", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#f8fafc\" stroke=\"#e2e8f0\"/>\n              <!-- Discrete Word Box -->\n              <rect x=\"40\" y=\"50\" width=\"160\" height=\"70\" rx=\"8\" fill=\"#fee2e2\" stroke=\"#f87171\" stroke-width=\"2\"/>\n              <text x=\"120\" y=\"80\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"14\" fill=\"#991b1b\">Discrete Symbol</text>\n              <text x=\"120\" y=\"105\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"16\" fill=\"#b91c1c\">\"happy\"</text>\n              \n              <!-- Cross Arrow -->\n              <path d=\"M 215 85 L 285 85\" stroke=\"#ef4444\" stroke-width=\"3\" stroke-dasharray=\"4,4\"/>\n              <line x1=\"240\" y1=\"70\" x2=\"260\" y2=\"100\" stroke=\"#dc2626\" stroke-width=\"4\"/>\n              <line x1=\"260\" y1=\"70\" x2=\"240\" y2=\"100\" stroke=\"#dc2626\" stroke-width=\"4\"/>\n              <text x=\"250\" y=\"125\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">Cannot Multiply</text>\n\n              <!-- Dense Vector Box -->\n              <rect x=\"310\" y=\"40\" width=\"330\" height=\"90\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#4ade80\" stroke-width=\"2\"/>\n              <text x=\"475\" y=\"65\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"14\" fill=\"#166534\">Continuous Vector Space</text>\n              <text x=\"475\" y=\"92\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"14\" fill=\"#15803d\">\u000bec{v} = [0.42, -0.19, 0.88, ..., -0.05]</text>\n              <text x=\"475\" y=\"115\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#16a34a\">\u2713 Fully Differentiable on GPU Tensor Cores</text>\n            </svg>"}, {"id": 2, "category": "NLP Pipeline", "difficulty": "EASY", "question": "What is the correct sequential order of operations in a standard deep learning NLP classification pipeline?", "options": ["Raw Text \u2794 Tokenization \u2794 Vocabulary Indexing (IDs) \u2794 Embedding Layer \u2794 Sequence Model", "Raw Text \u2794 Embedding Layer \u2794 Tokenization \u2794 Padding \u2794 Softmax", "Raw Text \u2794 Vocabulary Indexing \u2794 Subword BPE \u2794 Softmax \u2794 Embedding Layer", "Raw Text \u2794 Recurrent Layer \u2794 Tokenization \u2794 Dense Softmax \u2794 Embedding Table"], "correct": 0, "explanation": "The standard pipeline first normalizes and splits raw text into tokens (Tokenization), maps each token to an integer dictionary ID (Vocabulary Indexing), passes IDs into a lookup table (Embedding Layer) to yield continuous vectors, and then feeds those vectors to a sequence model (LSTM/GRU/Transformer).", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <!-- Pipeline Stages -->\n              <g transform=\"translate(20, 45)\">\n                <rect x=\"0\" y=\"0\" width=\"105\" height=\"60\" rx=\"6\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\"/>\n                <text x=\"52\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#64748b\">STAGE 1</text>\n                <text x=\"52\" y=\"45\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#0f172a\">Raw Text</text>\n                \n                <path d=\"M 112 30 L 130 30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n                <polygon points=\"130,26 136,30 130,34\" fill=\"#4f46e5\"/>\n\n                <rect x=\"140\" y=\"0\" width=\"105\" height=\"60\" rx=\"6\" fill=\"#fdf2f8\" stroke=\"#fbcfe8\"/>\n                <text x=\"192\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#db2777\">STAGE 2</text>\n                <text x=\"192\" y=\"45\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#9d174d\">Tokenization</text>\n\n                <path d=\"M 252 30 L 270 30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n                <polygon points=\"270,26 276,30 270,34\" fill=\"#4f46e5\"/>\n\n                <rect x=\"280\" y=\"0\" width=\"105\" height=\"60\" rx=\"6\" fill=\"#fefce8\" stroke=\"#fef08a\"/>\n                <text x=\"332\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#ca8a04\">STAGE 3</text>\n                <text x=\"332\" y=\"45\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#854d0e\">Token IDs</text>\n\n                <path d=\"M 392 30 L 410 30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n                <polygon points=\"410,26 416,30 410,34\" fill=\"#4f46e5\"/>\n\n                <rect x=\"420\" y=\"0\" width=\"105\" height=\"60\" rx=\"6\" fill=\"#f0f9ff\" stroke=\"#bae6fd\"/>\n                <text x=\"472\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#0284c7\">STAGE 4</text>\n                <text x=\"472\" y=\"45\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#0369a1\">Embeddings</text>\n\n                <path d=\"M 532 30 L 550 30\" stroke=\"#4f46e5\" stroke-width=\"2\"/>\n                <polygon points=\"550,26 556,30 550,34\" fill=\"#4f46e5\"/>\n\n                <rect x=\"560\" y=\"0\" width=\"105\" height=\"60\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#bbf7d0\"/>\n                <text x=\"612\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"10\" fill=\"#16a34a\">STAGE 5</text>\n                <text x=\"612\" y=\"45\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#15803d\">LSTM/Attn</text>\n              </g>\n            </svg>"}, {"id": 3, "category": "One-Hot Encoding", "difficulty": "EASY", "question": "What is the primary mathematical drawback of representing words using One-Hot Vectors?", "options": ["One-hot vectors require non-linear polynomial kernel transformations", "All one-hot vectors are mutually orthogonal, so their dot product is always zero and encodes no semantic similarity", "One-hot vectors cannot be converted into integer numbers by the CPU", "One-hot vectors can only encode positive adjectives"], "correct": 1, "explanation": "For any two distinct one-hot vectors u and v, exactly one position is 1 in u and another in v. Their dot product u\u00b7v is strictly 0, and their Euclidean distance is always \u221a2. Thus, 'hotel' and 'motel' are just as distant as 'hotel' and 'cat'!", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <!-- One Hot Orthogonal axes -->\n              <g transform=\"translate(60, 20)\">\n                <line x1=\"40\" y1=\"130\" x2=\"220\" y2=\"130\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n                <line x1=\"40\" y1=\"130\" x2=\"40\" y2=\"20\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n                \n                <line x1=\"40\" y1=\"130\" x2=\"180\" y2=\"130\" stroke=\"#ef4444\" stroke-width=\"3\"/>\n                <text x=\"180\" y=\"145\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#dc2626\">\"hotel\" [1,0,0]</text>\n                \n                <line x1=\"40\" y1=\"130\" x2=\"40\" y2=\"30\" stroke=\"#3b82f6\" stroke-width=\"3\"/>\n                <text x=\"50\" y=\"30\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#2563eb\">\"motel\" [0,1,0]</text>\n\n                <path d=\"M 60 130 A 20 20 0 0 0 40 110\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\"/>\n                <text x=\"68\" y=\"115\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#64748b\">\u03b8=90\u00b0 (dot product = 0!)</text>\n              </g>\n\n              <g transform=\"translate(360, 45)\">\n                <rect x=\"0\" y=\"0\" width=\"280\" height=\"85\" rx=\"8\" fill=\"#fff1f2\" stroke=\"#fecdd3\"/>\n                <text x=\"140\" y=\"30\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#be123c\">The Curse of Orthogonality</text>\n                <text x=\"140\" y=\"52\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" fill=\"#9f1239\">\\mathbf{u}_{\text{hotel}} \\cdot \\mathbf{v}_{\text{motel}} = 0.0</text>\n                <text x=\"140\" y=\"72\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#881337\">Zero semantic relationship captured!</text>\n              </g>\n            </svg>"}, {"id": 4, "category": "Tokenization Comparison", "difficulty": "MODERATE", "question": "Why did modern NLP models abandon pure Word-level and pure Character-level tokenization in favor of Subword algorithms (BPE / WordPiece)?", "options": ["Subword algorithms prevent GPU memory leaks caused by floating-point rounding errors", "Word-level creates massive out-of-memory vocabularies with OOV errors, while Character-level dilates sequences into excessive timesteps that blur meaning", "Subwords are legally required by international copyright law for commercial LLMs", "Character-level tokenization cannot represent whitespace characters"], "correct": 1, "explanation": "Word-level tokenization requires dictionaries of 500k+ words and still crashes on unseen words (OOV). Character-level has a tiny vocabulary (~256 bytes) but increases sequence lengths by 5-10\u00d7, overwhelming recurrent memory or quadratic transformer attention. Subwords hit the optimal sweet spot!", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <!-- 3 Column comparison -->\n              <g transform=\"translate(30, 25)\">\n                <!-- Word Level -->\n                <rect x=\"0\" y=\"0\" width=\"180\" height=\"130\" rx=\"8\" fill=\"#fef2f2\" stroke=\"#fca5a5\"/>\n                <text x=\"90\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#b91c1c\">Word-Level</text>\n                <text x=\"90\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#7f1d1d\">\u2022 Giant Vocab (500k+)</text>\n                <text x=\"90\" y=\"80\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#7f1d1d\">\u2022 OOV [UNK] Failures</text>\n                <text x=\"90\" y=\"105\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#7f1d1d\">\u2022 Short Sequence Length</text>\n\n                <!-- Character Level -->\n                <rect x=\"220\" y=\"0\" width=\"180\" height=\"130\" rx=\"8\" fill=\"#fefce8\" stroke=\"#fde047\"/>\n                <text x=\"310\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#a16207\">Character-Level</text>\n                <text x=\"310\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#713f12\">\u2022 Tiny Vocab (~256)</text>\n                <text x=\"310\" y=\"80\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#713f12\">\u2022 Zero OOV</text>\n                <text x=\"310\" y=\"105\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#dc2626\">\u2022 10\u00d7 Longer Sequences!</text>\n\n                <!-- Subword (BPE) -->\n                <rect x=\"440\" y=\"0\" width=\"180\" height=\"130\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#86efac\" stroke-width=\"2\"/>\n                <text x=\"530\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#15803d\">Subword (BPE/WP) \ud83c\udf1f</text>\n                <text x=\"530\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#14532d\">\u2022 Compact Vocab (32k-64k)</text>\n                <text x=\"530\" y=\"80\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#14532d\">\u2022 Zero OOV Errors</text>\n                <text x=\"530\" y=\"105\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#16a34a\">\u2022 Optimal Seq Length</text>\n              </g>\n            </svg>"}, {"id": 5, "category": "BPE Mechanics", "difficulty": "EASY", "question": "How does the Byte-Pair Encoding (BPE) training algorithm build its subword vocabulary?", "options": ["By randomly splitting sentences at vowel boundaries", "By starting with individual characters and iteratively merging the most frequent adjacent symbol pair across the corpus", "By applying principal component analysis (PCA) to text strings", "By sorting the dictionary alphabetically and picking every 10th word"], "correct": 1, "explanation": "BPE begins with a base vocabulary of single characters. It counts the frequencies of all adjacent symbol pairs in the corpus, selects the most frequent pair (e.g. 'e' and 's'), merges them into a new single subword token ('es'), and repeats this process for a pre-configured number of merge operations.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(40, 35)\">\n                <!-- Initial Characters -->\n                <rect x=\"0\" y=\"15\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#f1f5f9\" stroke=\"#cbd5e1\"/>\n                <text x=\"80\" y=\"45\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"13\" fill=\"#0f172a\">['n', 'e', 'w', 'e', 's', 't']</text>\n\n                <path d=\"M 175 40 L 220 40\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"220,36 226,40 220,44\" fill=\"#4f46e5\"/>\n\n                <!-- Pair Frequency Check -->\n                <rect x=\"235\" y=\"10\" width=\"160\" height=\"60\" rx=\"6\" fill=\"#fefce8\" stroke=\"#fde047\"/>\n                <text x=\"315\" y=\"32\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#854d0e\">Top Pair: ('e', 's')</text>\n                <text x=\"315\" y=\"52\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#ca8a04\">Frequency = 9 times</text>\n\n                <path d=\"M 405 40 L 450 40\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"450,36 456,40 450,44\" fill=\"#4f46e5\"/>\n\n                <!-- Merged Subword -->\n                <rect x=\"465\" y=\"15\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#f0fdf4\" stroke=\"#86efac\" stroke-width=\"2\"/>\n                <text x=\"545\" y=\"45\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"13\" fill=\"#15803d\">['n', 'e', 'w', <tspan font-weight=\"800\" fill=\"#16a34a\">'es'</tspan>, 't']</text>\n              </g>\n              <text x=\"340\" y=\"130\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#64748b\">New subword 'es' added to vocabulary!</text>\n            </svg>"}, {"id": 6, "category": "Subword Algorithms", "difficulty": "MODERATE", "question": "Which modern LLM architecture is canonically paired with Byte-Pair Encoding (BPE), and which is paired with WordPiece?", "options": ["GPT uses BPE; BERT uses WordPiece", "BERT uses BPE; ResNet uses WordPiece", "GPT uses WordPiece; LLaMA uses Character-Level", "All deep learning models use the exact same WordPiece tokenizer"], "correct": 0, "explanation": "OpenAI's GPT family (GPT-2, GPT-3, GPT-4) and Meta's LLaMA use Byte-Pair Encoding (BPE) (or byte-level BPE). Google's BERT utilizes WordPiece, which maximizes the likelihood of the training data rather than just raw frequency counts.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 30)\">\n                <!-- BPE Box -->\n                <rect x=\"0\" y=\"0\" width=\"250\" height=\"90\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#7dd3fc\"/>\n                <text x=\"125\" y=\"28\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"14\" fill=\"#0369a1\">Byte-Pair Encoding (BPE)</text>\n                <text x=\"125\" y=\"52\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#0284c7\">Criterion: Frequency of adjacent pairs</text>\n                <text x=\"125\" y=\"74\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"700\" font-size=\"12\" fill=\"#075985\">Used in: GPT-2/3/4, LLaMA, RoBERTa</text>\n\n                <!-- WordPiece Box -->\n                <rect x=\"310\" y=\"0\" width=\"250\" height=\"90\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#d8b4fe\"/>\n                <text x=\"435\" y=\"28\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"14\" fill=\"#7e22ce\">WordPiece Tokenizer</text>\n                <text x=\"435\" y=\"52\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#9333ea\">Criterion: Unigram Language Model Likelihood</text>\n                <text x=\"435\" y=\"74\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"700\" font-size=\"12\" fill=\"#581c87\">Used in: BERT, DistilBERT, Electra</text>\n              </g>\n            </svg>"}, {"id": 7, "category": "Word Embeddings", "difficulty": "EASY", "question": "What famous semantic vector relationship discovered in Word2Vec demonstrated that word embeddings capture relational concepts?", "options": ["vec(Cat) + vec(Dog) = vec(Tiger)", "vec(King) - vec(Man) + vec(Woman) \u2248 vec(Queen)", "vec(Apple) / vec(Orange) = vec(Fruit)", "vec(Python) * vec(Java) = vec(C++)"], "correct": 1, "explanation": "Mikolov et al. (2013) demonstrated that dense embeddings capture linear regularities. Subtracting the vector for 'Man' from 'King' isolates the abstract concept of 'Royalty'. Adding the vector for 'Woman' yields a coordinate that is closest to 'Queen'!", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(80, 25)\">\n                <!-- Vector Geometry -->\n                <circle cx=\"60\" cy=\"40\" r=\"7\" fill=\"#4f46e5\"/>\n                <text x=\"60\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#4f46e5\">King</text>\n\n                <circle cx=\"60\" cy=\"110\" r=\"7\" fill=\"#2563eb\"/>\n                <text x=\"60\" y=\"132\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#2563eb\">Man</text>\n\n                <!-- Offset vector arrow -->\n                <line x1=\"60\" y1=\"110\" x2=\"60\" y2=\"47\" stroke=\"#dc2626\" stroke-width=\"3\"/>\n                <polygon points=\"56,47 60,40 64,47\" fill=\"#dc2626\"/>\n                <text x=\"35\" y=\"80\" text-anchor=\"end\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">+Royalty</text>\n\n                <!-- Parallel Gender Shift -->\n                <circle cx=\"280\" cy=\"40\" r=\"7\" fill=\"#ec4899\"/>\n                <text x=\"280\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#ec4899\">Queen</text>\n\n                <circle cx=\"280\" cy=\"110\" r=\"7\" fill=\"#db2777\"/>\n                <text x=\"280\" y=\"132\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#db2777\">Woman</text>\n\n                <line x1=\"280\" y1=\"110\" x2=\"280\" y2=\"47\" stroke=\"#dc2626\" stroke-width=\"3\"/>\n                <polygon points=\"276,47 280,40 284,47\" fill=\"#dc2626\"/>\n                <text x=\"305\" y=\"80\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">+Royalty</text>\n\n                <!-- Gender bridge -->\n                <line x1=\"67\" y1=\"40\" x2=\"273\" y2=\"40\" stroke=\"#94a3b8\" stroke-dasharray=\"4,4\" stroke-width=\"2\"/>\n                <line x1=\"67\" y1=\"110\" x2=\"273\" y2=\"110\" stroke=\"#94a3b8\" stroke-dasharray=\"4,4\" stroke-width=\"2\"/>\n              </g>\n              <text x=\"500\" y=\"80\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"13\" font-weight=\"700\" fill=\"#4f46e5\">\u000bec{v}_{\text{King}} - \u000bec{v}_{\text{Man}} \u0007pprox \u000bec{v}_{\text{Queen}} - \u000bec{v}_{\text{Woman}}</text>\n              <text x=\"500\" y=\"105\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#64748b\">Semantic directions are parallel across concepts!</text>\n            </svg>"}, {"id": 8, "category": "Cosine Similarity", "difficulty": "EASY", "question": "Why is Cosine Similarity preferred over Euclidean distance when comparing text and word embeddings?", "options": ["Cosine similarity measures the angle between vectors, making it invariant to the magnitude or frequency of words", "Cosine similarity produces negative values that can be ignored by ReLU", "Euclidean distance cannot be computed in higher than 3 dimensions", "Cosine similarity runs on GPUs without floating-point units"], "correct": 0, "explanation": "Euclidean distance is sensitive to vector magnitudes: a long document containing a word 100 times will have huge Euclidean distance from a 1-sentence tweet containing it once. Cosine similarity normalizes both vectors by their L2 norms, measuring pure directional alignment between -1.0 and +1.0.", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(80, 20)\">\n                <!-- Vectors with angle \u03b8 -->\n                <line x1=\"30\" y1=\"130\" x2=\"240\" y2=\"130\" stroke=\"#cbd5e1\" stroke-width=\"2\"/>\n                <line x1=\"30\" y1=\"130\" x2=\"30\" y2=\"20\" stroke=\"#cbd5e1\" stroke-width=\"2\"/>\n\n                <!-- Vector u -->\n                <line x1=\"30\" y1=\"130\" x2=\"160\" y2=\"40\" stroke=\"#4f46e5\" stroke-width=\"3.5\"/>\n                <text x=\"170\" y=\"38\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#4f46e5\">\u000bec{u}</text>\n\n                <!-- Vector v (different length, same angle) -->\n                <line x1=\"30\" y1=\"130\" x2=\"220\" y2=\"65\" stroke=\"#ec4899\" stroke-width=\"3.5\"/>\n                <text x=\"230\" y=\"65\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#ec4899\">\u000bec{v}</text>\n\n                <!-- Angle \u03b8 -->\n                <path d=\"M 80 115 A 35 35 0 0 0 85 92\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"3\"/>\n                <text x=\"96\" y=\"105\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"800\" fill=\"#f59e0b\">\u03b8</text>\n              </g>\n\n              <g transform=\"translate(370, 45)\">\n                <rect x=\"0\" y=\"0\" width=\"270\" height=\"90\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\"/>\n                <text x=\"135\" y=\"30\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"13\" font-weight=\"700\" fill=\"#0369a1\">\\cos(\theta) = \frac{\\mathbf{u} \\cdot \\mathbf{v}}{\\|\\mathbf{u}\\|_2 \\|\\mathbf{v}\\|_2}</text>\n                <text x=\"135\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#0284c7\">\u03b8 \u2248 0\u00b0 \u2794 \\cos(\theta) \u2248 1.0 (Identical Meaning)</text>\n                <text x=\"135\" y=\"75\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#075985\">Completely unaffected by vector length!</text>\n              </g>\n            </svg>"}, {"id": 9, "category": "Word2Vec CBOW", "difficulty": "EASY", "question": "In the Word2Vec Continuous Bag of Words (CBOW) architecture, what is the training objective?", "options": ["Predict the surrounding context words given a single center target word", "Predict the center target word given the average of its surrounding context words", "Classify whether a sentence is grammatically correct", "Translate English words into French embeddings"], "correct": 1, "explanation": "CBOW takes the context words within a sliding window (e.g. w_{t-2}, w_{t-1}, w_{t+1}, w_{t+2}), averages their projected embeddings, and optimizes the network to maximize the probability of predicting the missing center target word w_t.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(50, 25)\">\n                <!-- Context words -->\n                <rect x=\"0\" y=\"0\" width=\"120\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"60\" y=\"17\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t-2} (\"quick\")</text>\n\n                <rect x=\"0\" y=\"32\" width=\"120\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"60\" y=\"49\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t-1} (\"brown\")</text>\n\n                <rect x=\"0\" y=\"64\" width=\"120\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"60\" y=\"81\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t+1} (\"jumps\")</text>\n\n                <rect x=\"0\" y=\"96\" width=\"120\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"60\" y=\"113\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t+2} (\"over\")</text>\n\n                <!-- Arrows to Projection -->\n                <path d=\"M 125 60 L 220 60\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"220,56 226,60 220,64\" fill=\"#4f46e5\"/>\n\n                <!-- Projection Box -->\n                <rect x=\"230\" y=\"25\" width=\"130\" height=\"70\" rx=\"6\" fill=\"#f3e8ff\" stroke=\"#c084fc\"/>\n                <text x=\"295\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#7e22ce\">Projection Layer</text>\n                <text x=\"295\" y=\"75\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#9333ea\">(SUM / AVERAGE)</text>\n\n                <!-- Arrow to Output -->\n                <path d=\"M 365 60 L 450 60\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"450,56 456,60 450,64\" fill=\"#4f46e5\"/>\n\n                <!-- Target Output Box -->\n                <rect x=\"460\" y=\"30\" width=\"150\" height=\"60\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#f87171\" stroke-width=\"2\"/>\n                <text x=\"535\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#991b1b\">TARGET WORD:</text>\n                <text x=\"535\" y=\"75\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"800\" font-size=\"14\" fill=\"#b91c1c\">w_t (\"fox\")</text>\n              </g>\n            </svg>"}, {"id": 10, "category": "Word2Vec Skip-Gram", "difficulty": "EASY", "question": "In the Word2Vec Skip-Gram architecture, what is the training objective?", "options": ["Predict the surrounding context words given a single center target word", "Skip odd-numbered words to speed up gradient descent", "Predict the next sentence in a paragraph", "Discard negative numbers during backpropagation"], "correct": 0, "explanation": "Skip-Gram inverts CBOW: it takes one center word w_t as input and predicts the probability distribution of context words appearing within window distance C around it. It performs exceptionally well on rare words because each context pairing yields a direct gradient update.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(50, 25)\">\n                <!-- Center Input Word -->\n                <rect x=\"0\" y=\"30\" width=\"140\" height=\"60\" rx=\"6\" fill=\"#fef2f2\" stroke=\"#f87171\" stroke-width=\"2\"/>\n                <text x=\"70\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#991b1b\">INPUT TARGET:</text>\n                <text x=\"70\" y=\"75\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"800\" font-size=\"14\" fill=\"#b91c1c\">w_t (\"fox\")</text>\n\n                <!-- Arrow to Projection -->\n                <path d=\"M 145 60 L 220 60\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"220,56 226,60 220,64\" fill=\"#4f46e5\"/>\n\n                <!-- Projection Box -->\n                <rect x=\"230\" y=\"30\" width=\"120\" height=\"60\" rx=\"6\" fill=\"#f3e8ff\" stroke=\"#c084fc\"/>\n                <text x=\"290\" y=\"58\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#7e22ce\">Projection</text>\n                <text x=\"290\" y=\"74\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#9333ea\">\\mathbf{v}_{w_t}</text>\n\n                <!-- Arrow to Output Contexts -->\n                <path d=\"M 355 60 L 440 60\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"440,56 446,60 440,64\" fill=\"#4f46e5\"/>\n\n                <!-- Predicted Contexts -->\n                <rect x=\"450\" y=\"0\" width=\"130\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"515\" y=\"17\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t-2} (\"quick\")</text>\n\n                <rect x=\"450\" y=\"32\" width=\"130\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"515\" y=\"49\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t-1} (\"brown\")</text>\n\n                <rect x=\"450\" y=\"64\" width=\"130\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"515\" y=\"81\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t+1} (\"jumps\")</text>\n\n                <rect x=\"450\" y=\"96\" width=\"130\" height=\"26\" rx=\"4\" fill=\"#e0f2fe\" stroke=\"#38bdf8\"/>\n                <text x=\"515\" y=\"113\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#0369a1\">w_{t+2} (\"over\")</text>\n              </g>\n            </svg>"}, {"id": 11, "category": "Negative Sampling", "difficulty": "MODERATE", "question": "How does Negative Sampling solve the computational bottleneck of standard Softmax in Word2Vec?", "options": ["It replaces multi-class softmax over vocabulary size V with 1 positive binary logistic regression and k randomly sampled negative noise updates", "It clips all negative gradient updates to zero to prevent catastrophic forgetting", "It restricts the model to only train on negative sentiment sentences", "It computes exact matrix inversions using Gauss-Jordan elimination"], "correct": 0, "explanation": "Standard softmax requires summing exp(v'_w\u00b7v_c) over every word in the dictionary (e.g. V = 100,000) for every single step. Negative sampling reformulates the task: discriminate the true context word from k=5 randomly drawn noise words, reducing computation from O(V) to O(k)!", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(40, 25)\">\n                <!-- Full Softmax -->\n                <rect x=\"0\" y=\"0\" width=\"260\" height=\"110\" rx=\"8\" fill=\"#fef2f2\" stroke=\"#fca5a5\"/>\n                <text x=\"130\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#991b1b\">Full Softmax: O(V)</text>\n                <text x=\"130\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#b91c1c\">\\sum_{w=1}^{100,000} \\exp(\\mathbf{v}'_w \\mathbf{v}_c)</text>\n                <text x=\"130\" y=\"85\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#7f1d1d\">100,000 exponents per token step!</text>\n\n                <!-- Negative Sampling -->\n                <rect x=\"330\" y=\"0\" width=\"280\" height=\"110\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#86efac\" stroke-width=\"2\"/>\n                <text x=\"470\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#15803d\">Negative Sampling: O(k) \ud83c\udf1f</text>\n                <text x=\"470\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#166534\">\\log \\sigma(\\mathbf{v}'_O \\mathbf{v}_I) + \\sum_{i=1}^5 \\log \\sigma(-\\mathbf{v}'_{w_i} \\mathbf{v}_I)</text>\n                <text x=\"470\" y=\"85\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#16a34a\">Just 1 positive + 5 negative updates!</text>\n              </g>\n            </svg>"}, {"id": 12, "category": "GloVe", "difficulty": "MODERATE", "question": "What is the core conceptual foundation of Stanford's GloVe (Global Vectors for Word Representation)?", "options": ["It trains an autoencoder on character ASCII bytes", "It factors the global word-word co-occurrence matrix by matching vector dot products to log co-occurrence probabilities", "It scans Wikipedia articles using convolutional filters to predict grammar trees", "It uses genetic algorithms to mutate random word vectors until sentiment accuracy exceeds 90%"], "correct": 1, "explanation": "Pennington et al. (2014) showed that ratios of word-word co-occurrence probabilities encode subtle thermodynamic and semantic distinctions. GloVe directly optimizes w_i^T w_j + b_i + b_j \u2248 log(X_{ij}), combining global count statistics with bilinear vector representations.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 25)\">\n                <!-- Co-occurrence Matrix -->\n                <rect x=\"0\" y=\"0\" width=\"180\" height=\"110\" rx=\"6\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n                <text x=\"90\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#475569\">Global Matrix X_{ij}</text>\n                <text x=\"90\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#64748b\">[Count of word i</text>\n                <text x=\"90\" y=\"75\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" fill=\"#64748b\">near word j]</text>\n\n                <!-- Arrow -->\n                <path d=\"M 200 55 L 250 55\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"250,51 256,55 250,59\" fill=\"#4f46e5\"/>\n\n                <!-- Objective Equation -->\n                <rect x=\"270\" y=\"10\" width=\"300\" height=\"90\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#d8b4fe\"/>\n                <text x=\"420\" y=\"35\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#7e22ce\">GloVe Bilinear Objective</text>\n                <text x=\"420\" y=\"62\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" font-weight=\"700\" fill=\"#6b21a8\">\\mathbf{w}_i^T \\mathbf{\tilde{w}}_j + b_i + \tilde{b}_j \u0007pprox \\log(X_{ij})</text>\n                <text x=\"420\" y=\"82\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" fill=\"#9333ea\">Global counts \u2794 Dense semantic vectors!</text>\n              </g>\n            </svg>"}, {"id": 13, "category": "FastText", "difficulty": "EASY", "question": "Why does Facebook's FastText successfully represent rare, compound, and misspelled words that Word2Vec cannot?", "options": ["FastText stores words as character n-grams and computes final word embeddings by summing their subword vectors", "FastText accesses a live online dictionary via an HTTP API during the forward pass", "FastText automatically corrects typos using spellcheck before neural networks see them", "FastText uses 10\u00d7 higher learning rates on misspelled words"], "correct": 0, "explanation": "In FastText (Bojanowski et al., 2017), each word is represented as a bag of character n-grams (e.g. 'where' is <wh, whe, her, ere, re>). Even if 'appllee' was never seen in training, it shares subwords with 'apple', so its vector is constructed naturally without crashing into an unknown token [UNK]!", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(50, 30)\">\n                <!-- Misspelled Word -->\n                <rect x=\"0\" y=\"20\" width=\"150\" height=\"55\" rx=\"6\" fill=\"#fff1f2\" stroke=\"#fda4af\"/>\n                <text x=\"75\" y=\"42\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#be123c\">Unseen Typo Word:</text>\n                <text x=\"75\" y=\"62\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"700\" font-size=\"13\" fill=\"#9f1239\">\"appllee\"</text>\n\n                <!-- Arrow -->\n                <path d=\"M 165 47 L 220 47\" stroke=\"#4f46e5\" stroke-width=\"2.5\"/>\n                <polygon points=\"220,43 226,47 220,51\" fill=\"#4f46e5\"/>\n\n                <!-- Subwords -->\n                <rect x=\"235\" y=\"10\" width=\"340\" height=\"80\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#86efac\" stroke-width=\"2\"/>\n                <text x=\"405\" y=\"32\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#15803d\">Sum of Known Character Subwords:</text>\n                <text x=\"405\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#166534\">\\mathbf{v}_{\text{appllee}} = \\mathbf{z}_{\text{&lt;ap}} + \\mathbf{z}_{\text{app}} + \\mathbf{z}_{\text{ppl}} + \\mathbf{z}_{\text{ple&gt;}}</text>\n                <text x=\"405\" y=\"75\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#14532d\">\u2713 Reconstructs semantic meaning of \"apple\" with 0 OOV error!</text>\n              </g>\n            </svg>"}, {"id": 14, "category": "Embedding Layer", "difficulty": "EASY", "question": "How many trainable parameters are inside a `keras.layers.Embedding(input_dim=20000, output_dim=128)` layer?", "options": ["20,000 + 128 = 20,128 parameters", "20,000 \u00d7 128 = 2,560,000 parameters", "20,000 / 128 \u2248 156 parameters", "Zero parameters (embeddings are non-trainable constants)"], "correct": 1, "explanation": "An embedding layer is a 2D weight matrix W of size (Vocabulary_Size \u00d7 Embedding_Dimension). For input_dim=20000 and output_dim=128, the parameter count is exactly 20,000 \u00d7 128 = 2,560,000 floating-point weights, optimized via backpropagation.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 25)\">\n                <!-- Matrix Diagram -->\n                <rect x=\"0\" y=\"0\" width=\"220\" height=\"110\" rx=\"6\" fill=\"#f1f5f9\" stroke=\"#94a3b8\" stroke-width=\"2\"/>\n                <text x=\"110\" y=\"30\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"12\" fill=\"#334155\">Weight Matrix W</text>\n                <text x=\"110\" y=\"60\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" fill=\"#475569\">20,000 rows (Vocab)</text>\n                <text x=\"110\" y=\"85\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" fill=\"#475569\">128 cols (Dim)</text>\n\n                <!-- Calculation box -->\n                <g transform=\"translate(260, 15)\">\n                  <rect x=\"0\" y=\"0\" width=\"310\" height=\"80\" rx=\"8\" fill=\"#eef2ff\" stroke=\"#a5b4fc\"/>\n                  <text x=\"155\" y=\"30\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#3730a3\">Total Trainable Weights</text>\n                  <text x=\"155\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"14\" font-weight=\"800\" fill=\"#4f46e5\">20,000 \u00d7 128 = 2,560,000</text>\n                </g>\n              </g>\n            </svg>"}, {"id": 15, "category": "Sequence Padding", "difficulty": "MODERATE", "question": "Why was `padding='pre'` traditionally preferred over `padding='post'` when using basic unmasked Recurrent Neural Networks (RNNs)?", "options": ["'pre' padding makes sentences load faster from solid state drives", "With 'post' padding, a stream of trailing zeros at the end of the sentence dilutes the accumulated hidden state and washes away true sentiment", "'post' padding triggers negative eigenvalue crashes in CUDA drivers", "Keras requires 'pre' padding because words are processed in reverse alphabetical order"], "correct": 1, "explanation": "A basic RNN computes h_t = tanh(W_h h_{t-1} + W_x x_t). If a 3-word sentence is post-padded with ten zeros, the final ten recurrent steps process x_t = 0, diluting the real memory accumulated from the actual words! 'pre' padding places zeros at the beginning so the network reads real words last.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(40, 25)\">\n                <!-- Post Padding Danger -->\n                <rect x=\"0\" y=\"0\" width=\"280\" height=\"110\" rx=\"8\" fill=\"#fff1f2\" stroke=\"#fecdd3\"/>\n                <text x=\"140\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#9f1239\">padding='post' (Dilution Risk!)</text>\n                <text x=\"140\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#b91c1c\">['Loved', 'it', <tspan fill=\"#64748b\">0, 0, 0, 0</tspan>]</text>\n                <text x=\"140\" y=\"85\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" fill=\"#881337\">Trailing zeros wash away positive state!</text>\n\n                <!-- Pre Padding Safety -->\n                <rect x=\"320\" y=\"0\" width=\"280\" height=\"110\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#bbf7d0\" stroke-width=\"2\"/>\n                <text x=\"460\" y=\"25\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#166534\">padding='pre' (Optimal for RNN)</text>\n                <text x=\"460\" y=\"55\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\" fill=\"#15803d\">[<tspan fill=\"#64748b\">0, 0, 0, 0</tspan>, 'Loved', 'it']</text>\n                <text x=\"460\" y=\"85\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#14532d\">Real words are read right before classification!</text>\n              </g>\n            </svg>"}, {"id": 16, "category": "Dynamic Masking", "difficulty": "EASY", "question": "What is the primary role of the `keras.layers.Masking(mask_value=0)` layer or `mask_zero=True` in an embedding layer?", "options": ["It obscures user passwords and personal data in text for privacy", "It creates a boolean tensor that instructs subsequent sequence layers to bypass computation and backpropagation on padded zero timesteps", "It converts 32-bit floating point weights into 8-bit integers", "It drops 50% of the vocabulary randomly during validation"], "correct": 1, "explanation": "Masking allows recurrent layers (LSTM, GRU) to skip padded zeros. When mask_zero=True, an internal boolean mask [True, True, False, False] propagates downstream. The LSTM simply carries forward the previous hidden state without updating gates on False timesteps, preventing zero-padding distortion.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 25)\">\n                <!-- Token Tensor -->\n                <text x=\"0\" y=\"30\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#334155\">Tokens: [ 14,  82,   0,   0 ]</text>\n                \n                <!-- Boolean Mask -->\n                <text x=\"0\" y=\"65\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#4f46e5\">Mask:   [True, True, False, False]</text>\n\n                <!-- LSTM Execution Arrow -->\n                <g transform=\"translate(320, 10)\">\n                  <rect x=\"0\" y=\"0\" width=\"260\" height=\"85\" rx=\"8\" fill=\"#f0fdf4\" stroke=\"#86efac\"/>\n                  <text x=\"130\" y=\"30\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"11\" fill=\"#15803d\">LSTM Execution Guard</text>\n                  <text x=\"130\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" fill=\"#166534\">Steps 1 & 2: Update gates & memory</text>\n                  <text x=\"130\" y=\"72\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#dc2626\">Steps 3 & 4: BYPASSED! (Zero distortion)</text>\n                </g>\n              </g>\n            </svg>"}, {"id": 17, "category": "LSTM Cell State", "difficulty": "MODERATE", "question": "Why does the LSTM architecture solve the vanishing gradient problem that plagues vanilla RNNs?", "options": ["LSTMs replace tanh activations with LeakyReLU everywhere", "The cell state acts as an additive linear conveyor belt where gradients can flow backward across time without exponential decay when the forget gate is near 1", "LSTMs run forward and backward passes on separate GPUs", "LSTMs only process short sentences of length 5 or less"], "correct": 1, "explanation": "In a vanilla RNN, backpropagation through time multiplies gradients by the recurrent weight matrix Wh at every step (Wh^T), causing exponential decay. In an LSTM, the cell state update C_t = f_t * C_{t-1} + i_t * ~C_t is linear and additive. When f_t = 1, dC_t/dC_{t-1} = 1.0, preserving gradient highways across 100+ steps!", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(40, 25)\">\n                <!-- Linear Conveyor Belt -->\n                <line x1=\"40\" y1=\"45\" x2=\"560\" y2=\"45\" stroke=\"#4f46e5\" stroke-width=\"6\"/>\n                <text x=\"300\" y=\"30\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#4f46e5\">Cell State Additive Highway: C_t = f_t \\odot C_{t-1} + i_t \\odot \tilde{C}_t</text>\n\n                <!-- Backward Gradient Flow -->\n                <path d=\"M 520 85 L 80 85\" stroke=\"#16a34a\" stroke-width=\"3\" stroke-dasharray=\"4,4\"/>\n                <polygon points=\"80,81 74,85 80,89\" fill=\"#16a34a\"/>\n                <text x=\"300\" y=\"105\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"12\" font-weight=\"700\" fill=\"#15803d\">\frac{\\partial C_t}{\\partial C_{t-1}} = f_t \u0007pprox 1.0 \\implies \text{Zero Vanishing Gradient!}</text>\n              </g>\n            </svg>"}, {"id": 18, "category": "GRU vs LSTM", "difficulty": "EASY", "question": "What is the primary architectural difference between a Gated Recurrent Unit (GRU) and an LSTM?", "options": ["GRU merges the cell state and hidden state into one vector and uses only 2 gates (Reset and Update), slashing parameters by ~25%", "GRU uses 6 gates instead of 3 gates to increase capacity", "GRU cannot be trained using gradient descent", "GRU is designed exclusively for image computer vision tasks"], "correct": 0, "explanation": "The GRU (Cho et al., 2014) streamlines the LSTM. It eliminates the separate cell state C_t, combining it into the hidden state h_t, and merges the forget and input gates into a single Update Gate (z_t) alongside a Reset Gate (r_t). This saves ~25% parameters and trains 20-30% faster with comparable accuracy.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 25)\">\n                <!-- LSTM Spec -->\n                <rect x=\"0\" y=\"0\" width=\"250\" height=\"110\" rx=\"8\" fill=\"#fdf2f8\" stroke=\"#fbcfe8\"/>\n                <text x=\"125\" y=\"28\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#be123c\">LSTM Cell</text>\n                <text x=\"125\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#881337\">\u2022 3 Gates: Forget, Input, Output</text>\n                <text x=\"125\" y=\"75\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#881337\">\u2022 2 States: Cell State C_t & Hidden h_t</text>\n                <text x=\"125\" y=\"95\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#9f1239\">Params: 4 \u00d7 (d_h(d_h+d_x) + d_h)</text>\n\n                <!-- GRU Spec -->\n                <rect x=\"310\" y=\"0\" width=\"250\" height=\"110\" rx=\"8\" fill=\"#f0f9ff\" stroke=\"#bae6fd\" stroke-width=\"2\"/>\n                <text x=\"435\" y=\"28\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#0369a1\">GRU Cell \u26a1</text>\n                <text x=\"435\" y=\"55\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#075985\">\u2022 2 Gates: Reset & Update</text>\n                <text x=\"435\" y=\"75\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#075985\">\u2022 1 State: Unified Hidden h_t</text>\n                <text x=\"435\" y=\"95\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"10\" font-weight=\"700\" fill=\"#0284c7\">Params: 3 \u00d7 (d_h(d_h+d_x) + d_h) (-25%)</text>\n              </g>\n            </svg>"}, {"id": 19, "category": "Bidirectional LSTM", "difficulty": "EASY", "question": "Why is a Bidirectional LSTM (BiLSTM) significantly more effective for sentiment analysis than a unidirectional LSTM?", "options": ["BiLSTM runs twice as fast because it skips half the tokens", "It reads the text simultaneously from left-to-right and right-to-left, allowing context from upcoming words (e.g. 'at all' after 'not bad') to resolve ambiguous phrases", "BiLSTM does not require any word embeddings", "BiLSTM converts English sentences into audio waveforms"], "correct": 1, "explanation": "In human language, the true meaning of a phrase often depends on words that appear later in the sentence (e.g., 'not bad at all' vs 'not bad, but terrible'). A unidirectional model only knows past words. A BiLSTM concatenates forward state h_forward and backward state h_backward, providing complete 360-degree context at every word.", "diagram": "<svg viewBox=\"0 0 680 160\" style=\"width: 100%; max-height: 200px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"160\" rx=\"12\" fill=\"#fafaf9\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 20)\">\n                <!-- Forward Arrow -->\n                <line x1=\"30\" y1=\"30\" x2=\"520\" y2=\"30\" stroke=\"#2563eb\" stroke-width=\"3\"/>\n                <polygon points=\"520,26 526,30 520,34\" fill=\"#2563eb\"/>\n                <text x=\"275\" y=\"20\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#2563eb\">\u2794 Forward Stream (Past Context: \"The movie was not...\")</text>\n\n                <!-- Words -->\n                <g transform=\"translate(50, 48)\">\n                  <rect x=\"0\" y=\"0\" width=\"75\" height=\"32\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n                  <text x=\"37\" y=\"20\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\">The</text>\n\n                  <rect x=\"95\" y=\"0\" width=\"75\" height=\"32\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n                  <text x=\"132\" y=\"20\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\">plot</text>\n\n                  <rect x=\"190\" y=\"0\" width=\"75\" height=\"32\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n                  <text x=\"227\" y=\"20\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\">was</text>\n\n                  <rect x=\"285\" y=\"0\" width=\"75\" height=\"32\" rx=\"4\" fill=\"#fefce8\" stroke=\"#ca8a04\" stroke-width=\"2\"/>\n                  <text x=\"322\" y=\"20\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-weight=\"700\" font-size=\"11\" fill=\"#854d0e\">not bad</text>\n\n                  <rect x=\"380\" y=\"0\" width=\"75\" height=\"32\" rx=\"4\" fill=\"#ffffff\" stroke=\"#cbd5e1\"/>\n                  <text x=\"417\" y=\"20\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"11\">at all</text>\n                </g>\n\n                <!-- Backward Arrow -->\n                <line x1=\"520\" y1=\"105\" x2=\"30\" y2=\"105\" stroke=\"#ec4899\" stroke-width=\"3\"/>\n                <polygon points=\"30,101 24,105 30,109\" fill=\"#ec4899\"/>\n                <text x=\"275\" y=\"125\" text-anchor=\"middle\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#ec4899\">\u2b05 Backward Stream (Future Context: \"...at all, great!\")</text>\n              </g>\n            </svg>"}, {"id": 20, "category": "Self-Attention", "difficulty": "MODERATE", "question": "In the Scaled Dot-Product Attention mechanism Attention(Q, K, V) = softmax(QK^T / \u221ad_k) V, what is the role of dividing by \u221ad_k?", "options": ["It shrinks the dimensionality of the output vector to save memory", "It prevents dot products from growing excessively large in high dimensions, which would push softmax into near-zero gradient regions", "It converts complex numbers into real numbers", "It enforces dropout on odd-numbered query vectors"], "correct": 1, "explanation": "When the projection dimension d_k is large (e.g. d_k = 64 or 128), dot products Q\u00b7K grow large in magnitude: E[q\u00b7k] = 0, Var(q\u00b7k) = d_k. Large inputs push softmax into extreme regions with tiny gradients (vanishing gradients). Scaling by 1/\u221ad_k stabilizes the variance to 1.0, preserving healthy gradients during backpropagation!", "diagram": "<svg viewBox=\"0 0 680 180\" style=\"width: 100%; max-height: 220px;\" xmlns=\"http://www.w3.org/2000/svg\">\n              <rect width=\"680\" height=\"180\" rx=\"12\" fill=\"#ffffff\" stroke=\"#e2e8f0\"/>\n              <g transform=\"translate(60, 25)\">\n                <!-- Formula Breakdown Box -->\n                <rect x=\"0\" y=\"0\" width=\"560\" height=\"130\" rx=\"8\" fill=\"#faf5ff\" stroke=\"#d8b4fe\"/>\n                <text x=\"280\" y=\"35\" text-anchor=\"middle\" font-family=\"'JetBrains Mono', monospace\" font-size=\"16\" font-weight=\"800\" fill=\"#6b21a8\">\text{Attention}(\\mathbf{Q}, \\mathbf{K}, \\mathbf{V}) = \text{softmax}\\left(\frac{\\mathbf{Q} \\mathbf{K}^T}{\\sqrt{d_k}}\right) \\mathbf{V}</text>\n                \n                <line x1=\"40\" y1=\"55\" x2=\"520\" y2=\"55\" stroke=\"#e9d5ff\"/>\n\n                <g transform=\"translate(30, 70)\">\n                  <text x=\"0\" y=\"15\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#7e22ce\">\u2022 \\mathbf{Q} \\mathbf{K}^T:</text>\n                  <text x=\"65\" y=\"15\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#475569\">Calculates pairwise compatibility scores across all words simultaneously in parallel</text>\n\n                  <text x=\"0\" y=\"35\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#dc2626\">\u2022 \frac{1}{\\sqrt{d_k}}:</text>\n                  <text x=\"65\" y=\"35\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#b91c1c\">Critical scaling factor! Prevents softmax saturation and vanishing gradients</text>\n\n                  <text x=\"0\" y=\"55\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" font-weight=\"700\" fill=\"#16a34a\">\u2022 \text{softmax}(\\dots) \\mathbf{V}:</text>\n                  <text x=\"120\" y=\"55\" font-family=\"'Plus Jakarta Sans', sans-serif\" font-size=\"11\" fill=\"#475569\">Produces attention weights and computes dynamic contextual value sum</text>\n                </g>\n              </g>\n            </svg>"}];
    let currentIdx = 0;
    const userAnswers = Array(questionsData.length).fill(null);

    document.addEventListener('DOMContentLoaded', () => {
      renderPills();
      loadQuestion(0);
    });

    function renderPills() {
      const bar = document.getElementById('pills-bar');
      bar.innerHTML = questionsData.map((q, idx) => `
        <button class="pill-btn ${idx === currentIdx ? 'active' : ''}" id="pill-${idx}" onclick="jumpToQuestion(${idx})">
          ${idx + 1}
        </button>
      `).join('');
    }

    function jumpToQuestion(idx) {
      if (idx < 0 || idx >= questionsData.length) return;
      currentIdx = idx;
      updatePills();
      loadQuestion(idx);
    }

    function updatePills() {
      questionsData.forEach((_, idx) => {
        const pill = document.getElementById(`pill-${idx}`);
        if (!pill) return;
        pill.className = 'pill-btn';
        if (idx === currentIdx) pill.classList.add('active');

        if (userAnswers[idx] !== null) {
          if (userAnswers[idx] === questionsData[idx].correct) {
            pill.classList.add('correct');
          } else {
            pill.classList.add('wrong');
          }
        }
      });
    }

    function updateScore() {
      let score = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null && ans === questionsData[idx].correct) {
          score++;
        }
      });
      document.getElementById('score-counter').textContent = `${score} / ${questionsData.length}`;
    }

    function loadQuestion(idx) {
      const q = questionsData[idx];
      document.getElementById('q-category').textContent = q.category;
      const diffBadge = document.getElementById('q-diff');
      diffBadge.textContent = q.difficulty;
      diffBadge.className = 'badge-diff ' + q.difficulty.toLowerCase();
      document.getElementById('q-num-label').textContent = `QUESTION ${idx + 1} OF ${questionsData.length}`;
      document.getElementById('q-progress-text').textContent = `${idx + 1} / ${questionsData.length}`;
      document.getElementById('q-stem-text').textContent = q.question;

      document.getElementById('prev-btn').disabled = idx === 0;
      document.getElementById('next-btn').disabled = idx === questionsData.length - 1;

      // Render Options
      const letters = ['A', 'B', 'C', 'D'];
      const optContainer = document.getElementById('q-options-container');
      const alreadyAnswered = userAnswers[idx] !== null;

      optContainer.innerHTML = q.options.map((opt, oIdx) => {
        let extraClass = '';
        if (alreadyAnswered) {
          if (oIdx === q.correct) extraClass = 'correct';
          else if (oIdx === userAnswers[idx]) extraClass = 'wrong';
        }
        return `
          <button class="opt-btn ${extraClass}" id="opt-btn-${oIdx}" onclick="selectOption(${oIdx})" ${alreadyAnswered ? 'disabled' : ''}>
            <span class="opt-badge">${letters[oIdx]}</span>
            <span class="opt-text">${opt}</span>
          </button>
        `;
      }).join('');

      // Teaser vs Revealed Card
      const teaserCard = document.getElementById('q-teaser-card');
      const revealedCard = document.getElementById('q-revealed-card');

      if (alreadyAnswered) {
        teaserCard.style.display = 'none';
        revealedCard.classList.add('revealed');
        renderRevealedSection(idx, userAnswers[idx]);
      } else {
        teaserCard.style.display = 'flex';
        revealedCard.classList.remove('revealed');
      }

      // Rerender MathJax equations if any
      if (window.MathJax) {
        MathJax.typesetPromise();
      }
    }

    function selectOption(selectedOptIdx) {
      if (userAnswers[currentIdx] !== null) return; // already answered
      userAnswers[currentIdx] = selectedOptIdx;

      updateScore();
      updatePills();
      loadQuestion(currentIdx);
    }

    function renderRevealedSection(qIdx, selectedOptIdx) {
      const q = questionsData[qIdx];
      const isCorrect = selectedOptIdx === q.correct;

      const verdictTitle = document.getElementById('verdict-title');
      const verdictIcon = document.getElementById('verdict-icon');
      const verdictMsg = document.getElementById('verdict-msg');

      if (isCorrect) {
        verdictTitle.className = 'verdict-header correct';
        verdictIcon.textContent = '🎉';
        verdictMsg.textContent = 'Correct Answer! Outstanding intuition.';
      } else {
        verdictTitle.className = 'verdict-header wrong';
        verdictIcon.textContent = '❌';
        verdictMsg.textContent = `Incorrect! The correct answer is Option ${['A','B','C','D'][q.correct]}.`;
      }

      document.getElementById('diagram-container').innerHTML = q.diagram;
      document.getElementById('explanation-container').innerHTML = `
        <div style="font-weight: 800; color: var(--primary); margin-bottom: 6px;">💡 DETAILED ARCHITECTURAL EXPLANATION:</div>
        <div>${q.explanation}</div>
      `;
    }

    function navPrev() {
      if (currentIdx > 0) jumpToQuestion(currentIdx - 1);
    }

    function navNext() {
      if (currentIdx < questionsData.length - 1) jumpToQuestion(currentIdx + 1);
    }
  </script>
</body>
</html>
